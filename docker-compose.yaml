services:
  mysqldb:
    image: 'mysql:8.0'
    ports:
      - 3001:3306
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: OishiDatabase
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 30s
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - oishi-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8001:80
    environment:
      PMA_HOST: mysqldb
      PMA_PORT: 3306
    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - oishi-network

  oishi-server:
    build:
      context: ./oishi-server
      dockerfile: Dockerfile
    ports:
      - 8003:8080
    environment:
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: password123
      MYSQL_IP: mysqldb:3306
      APP_AUTH: /app/secrets
      SERVER_BIND_TO: 0.0.0.0:8080
    restart: always
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1
      interval: 50s
      timeout: 60s
      retries: 5
      start_period: 50s
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - oishi-network

  oishi-ui:
    build:
      context: ./oishi-ui
      dockerfile: Dockerfile
      target: prod
    ports:
      - 4000:8080
    depends_on:
      oishi-server:
        condition: service_healthy
    environment:
      API_SERVER_HOST: oishi-server:8080
    command: /bin/sh -c "nginx -g 'daemon off;'"
    restart: always
    networks:
      - oishi-network

networks:
  oishi-network:
    driver: bridge
